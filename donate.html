<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Donate Food - Campus Food Waste</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 0;
        }

        .menu {
            background-color: #2c3e50;
            padding: 15px;
            text-align: center;
        }
        .menu a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            font-size: 16px;
        }
        .menu a:hover {
            color: #e67e22;
        }

        .container {
            max-width: 500px;
            background: white;
            margin: 40px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        form label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
            color: #34495e;
        }

        form input, form select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        form button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        form button:hover {
            background-color: #2ecc71;
        }
    </style>
</head>
<body>

    <!-- Menu Bar -->
    <div class="menu">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/tips">Tips</a>
        <a href="/donate">Donate</a>
        <a href="/check_food">Check Food Status</a>
        <a href="/get_food">Get Food</a>
    </div>

    <!-- Donate Form -->
    <div class="container">
        <h1>Donate Food</h1>
        <form method="POST" action="/donate">
            <label>Name:</label>
            <input type="text" name="name" required placeholder="Enter your full name">

            <label>Food Variety:</label>
            <select name="food_variety" required>
                <option value="">Select variety</option>
                <option value="Rice">Rice</option>
                <option value="Curry">Curry</option>
                <option value="Idli">Idli</option>
                <option value="Dosa">Dosa</option>
                <option value="Bread">Bread</option>
                <option value="Snacks">Snacks</option>
                <option value="Other">Other</option>
            </select>

            <label>Quantity:</label>
            <input type="number" name="quantity" required placeholder="Enter quantity">

            <label>Food Type:</label>
            <select name="food_type" required>
                <option value="">Select</option>
                <option value="Veg">Veg</option>
                <option value="Non-Veg">Non-Veg</option>
            </select>

            <label>Cooking Date & Time:</label>
            <input type="datetime-local" name="cooking_datetime" required>

            <label>Price (per unit / total):</label>
            <input type="number" step="0.01" name="price" required placeholder="Enter price">

            <button type="submit">Donate</button>
        </form>
    </div>

</body>
</html>
