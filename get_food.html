<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Get Food - Campus Food Waste</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #fceabb, #f8b500);
            margin: 0;
            padding: 0;
        }

        .menu {
            background-color: #2c3e50;
            padding: 15px;
            text-align: center;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin: 0 15px;
            font-size: 16px;
        }

        .menu a:hover {
            color: #e67e22;
            transition: 0.3s;
        }

        .container {
            max-width: 500px;
            background-color: #ffffff;
            margin: 50px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 20px;
            color: #34495e;
        }

        select, input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-size: 15px;
        }

        select:hover, input:hover {
            border: 1px solid #2c3e50;
            transition: 0.3s;
        }

        button {
            width: 100%;
            background-color: #27ae60;
            color: white;
            font-size: 18px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            margin-top: 30px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2ecc71;
            transition: 0.3s;
        }

        .optional {
            font-size: 14px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <!-- Menu Bar -->
    <div class="menu">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/tips">Tips</a>
        <a href="/donate">Donate</a>
        <a href="/check_food">Check Food Status</a>
        <a href="/get_food">Get Food</a>
    </div>

    <div class="container">
        <h1>Get Food from Outside Suppliers</h1>

        <form method="POST" action="/get_food">
            <label>Supplier:</label>
            <select name="supplier_name" required>
                <option value="">Select Supplier</option>
                {% for supplier in suppliers %}
                    <option value="{{ supplier.name }}">{{ supplier.name }}</option>
                {% endfor %}
            </select>

            <label>Food Variety:</label>
            <select name="food_variety" required>
                <option value="">Select Variety</option>
                <option value="Rice">Rice</option>
                <option value="Idli/Dosa">Idli / Dosa</option>
                <option value="Vegetables">Vegetables</option>
                <option value="Snacks">Snacks</option>
                <option value="Sweets">Sweets</option>
            </select>

            <label>Quantity:</label>
            <input type="number" name="quantity" required placeholder="Enter quantity">

            <label>Food Type:</label>
            <select name="food_type" required>
                <option value="">Select</option>
                <option value="Veg">Veg</option>
                <option value="Non-Veg">Non-Veg</option>
            </select>

            <label>Cooking Date & Time:</label>
            <input type="datetime-local" name="cooking_datetime" required>

            <label>Price <span class="optional">(optional for demo, shows payment available)</span>:</label>
            <input type="number" step="0.01" name="price" placeholder="Enter price if applicable">

            <button type="submit">Get Food</button>
        </form>
    </div>

</body>
</html>
